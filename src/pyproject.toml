[project]
name = "cs2-realmap-generator"
version = "1.0.0"
description = "Générateur de bundles OpenStreetMap pour Cities: Skylines II"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.scripts]
extract-zoning = "extract_zoning:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tous les modules importés par extract_zoning doivent être packagés,
# sinon le wheel installé échoue à l'import.
py-modules = [
    "extract_zoning",
    "classifiers",
    "country_codes",
    "cs2_zones",
    "overpass_client",
    "road_categories",
    "service_families",
]
